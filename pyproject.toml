[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kltn-data-processing"
version = "0.1.0"
description = "Cross-domain NIDS preprocessing, baselines, and MMD experiments."
requires-python = ">=3.11"
dependencies = [
    "joblib",
    "matplotlib",
    "numpy",
    "optuna",
    "pandas",
    "pyarrow",
    "scipy",
    "scikit-learn",
    "torch",
    "umap-learn",
]

[project.optional-dependencies]
classical = ["xgboost"]
kaggle-stream = ["requests", "stream-unzip"]

[tool.setuptools.packages.find]
where = ["src"]
